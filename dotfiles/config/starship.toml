# Get editor completions based on the config schema
#:schema https://starship.rs/config-schema.json

# Sets user-defined palette
# Palettes must be defined _after_ this line
palette = "catppuccin_mocha"

format = """
 $all
"""
right_format = """$cmd_duration"""

# Starship modules
[fill]
symbol = " "

[character]
# Note the use of Catppuccin color 'peach'
success_symbol = "[ ❯](peach)"
error_symbol = "[ ❯](red)"
vimcmd_symbol = "[ ❮](subtext1)"

[git_branch]
symbol = " "
style = "bold mauve"

[directory]
read_only = " 󰌾"
truncation_length = 1
truncate_to_repo = false
fish_style_pwd_dir_length = 1
style = "bold blue"

[c]
symbol = " "

[docker_context]
symbol = " "

[fossil_branch]
symbol = " "

[golang]
symbol = " "

[haskell]
symbol = "λ "

[hg_branch]
symbol = " "

[java]
symbol = " "

[julia]
symbol = " "

[lua]
symbol = " "

[memory_usage]
symbol = "󰍛 "

[nim]
symbol = "󰆥 "

[nodejs]
symbol = "󰎙 "

[ocaml]
symbol = " "

[nix_shell]
symbol = " "

[package]
symbol = "󰏗 "

[perl]
symbol = " "

[php]
symbol = " "

[python]
symbol = " "

[ruby]
symbol = " "

